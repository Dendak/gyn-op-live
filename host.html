<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gyn-OP Live · Moderation</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="aufgaben.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Gyn-OP Live</h1>
      <p>Moderation · Teil 1</p>
    </div>
    <div class="tools">
      <span class="pill"><span class="dot" id="dot"></span><span id="conntext">verbinde …</span></span>
      <span class="pill"><b id="count">0</b> dabei</span>
      <button class="tbtn" id="btn-qr">QR-Code</button>
      <button class="tbtn" id="btn-full">Vollbild</button>
      <a class="tbtn" id="link-buehne" href="buehne.html">Aufgaben für die Bühne</a>
      <button class="tbtn quiet" id="btn-new">Neue Sitzung</button>
    </div>
  </div>
</header>

<div class="wrap layout">
  <nav aria-label="Blöcke">
    <ol class="blocks" id="rail"></ol>
    <p class="railnote">Tasten: <kbd>F</kbd> gibt den Abschnitt frei, <kbd>←</kbd> <kbd>→</kbd> blättert durch die Aufgaben, <kbd>L</kbd> zeigt die Lösung.</p>
  </nav>
  <main id="stage"></main>
</div>

<div class="join" id="join" hidden></div>

<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="fragen.js"></script>
<script src="live.js"></script>
<script src="host.js"></script>
</body>
</html>
